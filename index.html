<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Absensi Siswa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="appHeader" class="header" hidden>
    <h1>Sistem Absensi Siswa</h1>

    <div class="user-info">
      <span id="userEmail"></span>
      <button id="logoutButton" type="button" class="button button-secondary">
        Keluar
      </button>
    </div>
  </header>

  <main class="container">
    <section id="loginSection" class="card">
      <h2>Login</h2>

      <form id="loginForm">
        <label for="loginRole">Login sebagai</label>
        <select id="loginRole" required>
          <option value="siswa">Siswa</option>
          <option value="guru">Guru</option>
        </select>

        <label for="loginEmail" >Email</label>
        <input id="loginEmail" type="email" autocomplete="email"  placeholder="Masukan email." required >

        <label for="loginPassword">Password</label>
        <input
          id="loginPassword" type="password" autocomplete="current-password" required placeholder="Masukan password."
        >

        <button type="submit" class="button">Login</button>
      </form>

      <p id="loginMessage" class="message"></p>
    </section>

    <section id="studentSection" hidden>
      <div class="card">
        <h2>Form Absensi</h2>

        <form id="attendanceForm">
          <label for="attendanceDate">Tanggal</label>
          <input id="attendanceDate" type="date" readonly>

          <label for="studentName">Nama</label>
          <input id="studentName" type="text" maxlength="100" required placeholder="Masukan nama kamu.">

          <label for="studentClass">Kelas</label>
          <input id="studentClass" type="text" maxlength="50" required placeholder="Masukan kelas kamu.">

          <label for="attendanceReason">Keterangan</label>
          <select id="attendanceReason" required>
            <option value="">Pilih keterangan</option>
            <option value="Hadir">Hadir</option>
            <option value="Sakit">Sakit</option>
            <option value="Izin">Izin</option>
          </select>

          <button id="submitAttendanceButton" type="submit" class="button">
            Kirim Absensi
          </button>
        </form>

        <p id="attendanceMessage" class="message"></p>
      </div>

      <div class="card">
        <h2>Ringkasan Absensi</h2>

        <div class="summary">
          <div>Hadir: <strong id="countHadir">0</strong></div>
          <div>Sakit: <strong id="countSakit">0</strong></div>
          <div>Izin: <strong id="countIzin">0</strong></div>
          <div>Total: <strong id="countTotal">0</strong></div>
        </div>
      </div>

      <div class="card">
        <h2>Riwayat Absensi Saya</h2>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Nama</th>
                <th>Kelas</th>
                <th>Keterangan</th>
              </tr>
            </thead>
            <tbody id="studentHistoryBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="teacherSection" hidden>
      <div class="card">
        <h2>Data Absensi Siswa</h2>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Email Siswa</th>
                <th>Nama</th>
                <th>Kelas</th>
                <th>Keterangan</th>
              </tr>
            </thead>
            <tbody id="teacherTableBody"></tbody>
          </table>
        </div>

        <p id="teacherMessage" class="message"></p>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
